name: Build installable APK

# Produces the artifact you install on a phone.
#
# `android/` and `ios/` are not committed: they are generated by `flutter create`
# into a temporary directory on a clean checkout and copied in, so the recipe
# below is the only source of truth for how Mellow is built. Nothing in the
# repository is overwritten by the generation step.
#
# Run it from the Actions tab ("Run workflow") or push to the arena branch.
# The finished file is attached to the run as `mellow-debug-apk`, and also
# published as a `build-<sha7>` release — that release is the update channel
# the app reads itself (see docs/UPDATES.md).

on:
  workflow_dispatch:
    inputs:
      google_client_id:
        description: "GOOGLE_CLIENT_ID (необязательно; без него Gmail-вход честно скажет, что не настроен)"
        required: false
        default: ""
  push:
    branches:
      - arena/ef9ea789-mellow
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "tool/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches:
      - main

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# Commit comments with the failure log need write access.
permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  check:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      # Diagnostics go to the run summary as well as the log: the log download
      # is not reachable from every network, but the summary always renders in
      # the GitHub UI.
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          {
            echo "### flutter analyze (exit ${status})"
            echo '```'
            tail -n 200 analyze.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"

      - name: Architecture rules
        run: bash tool/check_structure.sh

      # The JSON reporter is the only reliable source of *which* assertion
      # failed: the expanded reporter interleaves printers and test output, so a
      # failure message can end up hundreds of lines away from its test.
      - name: Tests
        run: |
          set +e
          flutter test --reporter json 2>&1 | tee test.json
          status=${PIPESTATUS[0]}
          python3 tool/ci/summarize_tests.py test.json >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            analyze.log
            test.json
          if-no-files-found: ignore

      # Artifacts and job logs live on a blob host that some networks cannot
      # reach, so a failing run also posts its output as a commit comment —
      # readable anywhere the repository is.
      - name: Publish failure details
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tool/ci/collect_failures.py ci-failure.md
          python3 tool/ci/post_comment.py ci-failure.md

  apk:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_CLIENT_ID: ${{ github.event.inputs.google_client_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      # Generated outside the checkout, then copied in: `flutter create .`
      # would rewrite files the repository owns.
      - name: Generate Android project
        run: |
          set -euo pipefail
          flutter create --platforms=android --org app.mellow \
            --project-name mellow "$RUNNER_TEMP/platform"
          cp -r "$RUNNER_TEMP/platform/android" ./android

      - name: Compute OAuth redirect scheme
        id: scheme
        run: |
          set -euo pipefail
          scheme="app.mellow"
          if [ -n "${GOOGLE_CLIENT_ID}" ]; then
            bare="${GOOGLE_CLIENT_ID%.apps.googleusercontent.com}"
            scheme="com.googleusercontent.apps.${bare}"
          fi
          echo "value=${scheme}" >> "$GITHUB_OUTPUT"
          echo "Redirect scheme: ${scheme}"

      - name: Patch Android manifest
        run: python3 tool/platform/prepare_android.py --scheme "${{ steps.scheme.outputs.value }}"

      # The update flow installs a new build over the old one, and Android only
      # allows that when both are signed with the same key. Runners are fresh
      # machines, so their default debug key differs every run and the install
      # would fail with «Приложение не установлено». The key therefore comes
      # from the repository secrets and is written where the Android Gradle
      # plugin already looks for it — no Gradle edits, no extra tools.
      - name: Restore the stable debug signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.MELLOW_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::warning title=Signing key missing::MELLOW_DEBUG_KEYSTORE_B64 is not set, so this APK is signed with the runner's own debug key. Installing it over an earlier build may fail; see docs/UPDATES.md."
            echo "key=runner" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "${KEYSTORE_B64}" | base64 -d > "$HOME/.android/debug.keystore"
          # Fingerprint of the key that will sign this build. Compare it with
          # the previous build: different values mean an update cannot install.
          fingerprint="SHA-256 $(openssl dgst -sha256 \
            "$HOME/.android/debug.keystore" | awk '{print $2}')"
          echo "key=stable" >> "$GITHUB_OUTPUT"
          echo "Using the repository signing key"
          if [ -n "${fingerprint}" ]; then
            echo "::notice title=Signing key::${fingerprint}"
            {
              echo "### Signing key"
              echo '```'
              echo "${fingerprint}"
              echo '```'
              echo "Two builds with different fingerprints cannot install over each other."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build debug APK
        id: build
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          defines=(
            "--dart-define=MELLOW_UPDATE_REPO=${GITHUB_REPOSITORY}"
            "--dart-define=MELLOW_BUILD_SHA=${short_sha}"
          )
          if [ -n "${GOOGLE_CLIENT_ID}" ]; then
            defines+=("--dart-define=GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}")
            defines+=("--dart-define=GOOGLE_REDIRECT_URI=${{ steps.scheme.outputs.value }}:/oauth2redirect")
          fi
          set +e
          flutter build apk --debug "${defines[@]}" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          {
            echo "### flutter build apk (exit ${status})"
            echo '```'
            tail -n 120 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"

      - name: Rename artifact
        run: |
          set -euo pipefail
          out=build/app/outputs/flutter-apk
          short_sha="${GITHUB_SHA::7}"
          cp "$out/app-debug.apk" "$out/mellow-${short_sha}-debug.apk"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: mellow-debug-apk
          path: build/app/outputs/flutter-apk/mellow-*-debug.apk
          if-no-files-found: error
          retention-days: 30

      # The release is the update channel the app reads (docs/UPDATES.md).
      # A tag per build makes "is there something newer than my sha?" a single
      # API call, and the attached APK is what the app downloads.
      # Only real pushes to the branch may publish: a pull-request run builds a
      # synthetic merge commit that is never installable, and a release for it
      # would push that phantom tag into the update channel.
      - name: Publish release for the updater
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          tag="build-${short_sha}"
          apk="build/app/outputs/flutter-apk/mellow-${short_sha}-debug.apk"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists — uploading the APK into it"
            gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi

          notes="Сборка ${short_sha} из ветки ${GITHUB_REF_NAME}.
          Изменения: см. историю коммитов. Установка — docs/INSTALL.md.
          Подпись: ${{ steps.signing.outputs.key == 'stable' && 'постоянный ключ Mellow' || 'debug-ключ раннера (может не встать поверх)' }}."

          # No --prerelease on purpose: a prerelease makes /releases/latest
          # answer 404, and that is exactly how the channel broke the first
          # time. Normal release + the app reading the release list (see
          # docs/UPDATES.md §3.1) keeps it working either way.
          gh release create "$tag" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Сборка ${short_sha}" \
            --notes "$notes" \
            --target "$GITHUB_SHA"

      # Same reason as in the check job: the build log may be unreachable, but
      # the commit comment is not.
      - name: Publish build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MELLOW_BUILD_LOG: build.log
        run: |
          python3 tool/ci/collect_failures.py ci-failure.md
          python3 tool/ci/post_comment.py ci-failure.md

  ios:
    name: iOS build (no codesign)
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    # Advisory: without an Apple Developer account the result cannot be put on
    # a phone, and the macOS runner is much flakier than the Linux one. A red
    # iOS job must not hide a green APK.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate iOS project
        run: |
          set -euo pipefail
          flutter create --platforms=ios --org app.mellow \
            --project-name mellow "$RUNNER_TEMP/platform-ios"
          cp -r "$RUNNER_TEMP/platform-ios/ios" ./ios

      # Without an Apple Developer account the app cannot be signed or installed
      # on a phone; this job exists so an iOS compile error is caught here
      # rather than on a Mac later.
      - name: Compile (no codesign)
        run: flutter build ios --no-codesign --debug
