name: Build installable APK

# Produces the artifact you install on a phone.
#
# `android/` and `ios/` are not committed: they are generated by `flutter create`
# into a temporary directory on a clean checkout and copied in, so the recipe
# below is the only source of truth for how Mellow is built. Nothing in the
# repository is overwritten by the generation step.
#
# Run it from the Actions tab ("Run workflow") or push to the arena branch.
# The finished file is attached to the run as `mellow-debug-apk`.

on:
  workflow_dispatch:
    inputs:
      google_client_id:
        description: "GOOGLE_CLIENT_ID (необязательно; без него Gmail-вход честно скажет, что не настроен)"
        required: false
        default: ""
  push:
    branches:
      - arena/ef9ea789-mellow
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "tool/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches:
      - main

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# Commit comments with the failure log need write access.
permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  check:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      # Diagnostics go to the run summary as well as the log: the log download
      # is not reachable from every network, but the summary always renders in
      # the GitHub UI.
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          {
            echo "### flutter analyze (exit ${status})"
            echo '```'
            tail -n 200 analyze.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"

      - name: Architecture rules
        run: bash tool/check_structure.sh

      - name: Tests
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          {
            echo "### flutter test (exit ${status})"
            echo '```'
            tail -n 300 test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            analyze.log
            test.log
          if-no-files-found: ignore

      # Artifacts and job logs live on a blob host that some networks cannot
      # reach, so a failing run also posts its output as a commit comment —
      # readable anywhere the repository is.
      - name: Publish failure details
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "### CI failure for ${GITHUB_SHA:0:7}"
            echo
            echo '#### flutter analyze'
            echo '```'
            tail -n 120 analyze.log 2>/dev/null || echo "no analyze output"
            echo '```'
            echo
            echo '#### failing tests'
            echo '```'
            grep -E '\[E\]$' test.log 2>/dev/null \
              | sed -E 's/^[0-9:]+ \+[0-9]+ -[0-9]+: //' \
              | sed -E 's#^.*/MELLOW/##' \
              | sort -u || echo "no test output"
            echo '```'
            echo
            echo '#### failure details (60 lines before each failure)'
            echo '```'
            awk '{buf[NR]=$0}
                 /\[E\]$/ {s=NR-60; if (s<1) s=1; if (s<=last) s=last+1;
                           for (i=s; i<=NR; i++) print buf[i];
                           print "-----"; last=NR}' test.log 2>/dev/null \
              | head -n 900 || echo "none"
            echo '```'
            echo
            echo '#### tail of the test log'
            echo '```'
            tail -n 60 test.log 2>/dev/null || echo "no test output"
            echo '```'
          } > ci-failure.md

          python3 - <<'PY'
          import json, os, pathlib, urllib.request

          body = pathlib.Path("ci-failure.md").read_text(encoding="utf-8")
          data = json.dumps({"body": body[:60000]}).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/commits/{os.environ['GITHUB_SHA']}/comments",
              data=data,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request) as response:
              print("commit comment posted:", response.status)
          PY

  apk:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_CLIENT_ID: ${{ github.event.inputs.google_client_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      # Generated outside the checkout, then copied in: `flutter create .`
      # would rewrite files the repository owns.
      - name: Generate Android project
        run: |
          set -euo pipefail
          flutter create --platforms=android --org app.mellow \
            --project-name mellow "$RUNNER_TEMP/platform"
          cp -r "$RUNNER_TEMP/platform/android" ./android

      - name: Compute OAuth redirect scheme
        id: scheme
        run: |
          set -euo pipefail
          scheme="app.mellow"
          if [ -n "${GOOGLE_CLIENT_ID}" ]; then
            bare="${GOOGLE_CLIENT_ID%.apps.googleusercontent.com}"
            scheme="com.googleusercontent.apps.${bare}"
          fi
          echo "value=${scheme}" >> "$GITHUB_OUTPUT"
          echo "Redirect scheme: ${scheme}"

      - name: Patch Android manifest
        run: python3 tool/platform/prepare_android.py --scheme "${{ steps.scheme.outputs.value }}"

      - name: Build debug APK
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          defines=(
            "--dart-define=MELLOW_UPDATE_REPO=${GITHUB_REPOSITORY}"
            "--dart-define=MELLOW_BUILD_SHA=${short_sha}"
          )
          if [ -n "${GOOGLE_CLIENT_ID}" ]; then
            defines+=("--dart-define=GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}")
            defines+=("--dart-define=GOOGLE_REDIRECT_URI=${{ steps.scheme.outputs.value }}:/oauth2redirect")
          fi
          flutter build apk --debug "${defines[@]}"

      - name: Rename artifact
        run: |
          set -euo pipefail
          out=build/app/outputs/flutter-apk
          short_sha="${GITHUB_SHA::7}"
          cp "$out/app-debug.apk" "$out/mellow-${short_sha}-debug.apk"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: mellow-debug-apk
          path: build/app/outputs/flutter-apk/mellow-*-debug.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS build (no codesign)
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate iOS project
        run: |
          set -euo pipefail
          flutter create --platforms=ios --org app.mellow \
            --project-name mellow "$RUNNER_TEMP/platform-ios"
          cp -r "$RUNNER_TEMP/platform-ios/ios" ./ios

      # Without an Apple Developer account the app cannot be signed or installed
      # on a phone; this job exists so an iOS compile error is caught here
      # rather than on a Mac later.
      - name: Compile (no codesign)
        run: flutter build ios --no-codesign --debug
